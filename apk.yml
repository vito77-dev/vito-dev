name: Gerar APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preparar projeto
        run: |
          mkdir -p app/www && cd app
          cp -r "../A Colheita do Silêncio 2D/." www/
          echo '{"name":"colheita","version":"1.0.0","private":true}' > package.json
          echo '{"appId":"com.colheita.silencio","appName":"A Colheita do Silêncio","webDir":"www","backgroundColor":"#000000"}' > capacitor.config.json
          npm install @capacitor/core@6 @capacitor/android@6 @capacitor/cli@6 @capacitor/assets@3
          mkdir -p assets && convert www/icons/icon-512.png -resize 1024x1024 assets/icon-only.png || true
      - name: Criar app Android
        working-directory: app
        run: |
          npx cap add android
          sed -i 's/<activity /<activity android:screenOrientation="sensorLandscape" /' android/app/src/main/AndroidManifest.xml
          npx capacitor-assets generate --android || true
          npx cap sync android
      - name: Compilar APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: colheita-do-silencio-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
